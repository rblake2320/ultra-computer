  /api/structured-output/validate:
    post:
      operationId: validateStructuredOutput
      summary: Validate that a string matches a JSON schema
      tags: [QualityGates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [output, schema]
              properties:
                output:
                  type: string
                  description: JSON string to validate
                schema:
                  type: object
                  description: JSON Schema to validate against
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

