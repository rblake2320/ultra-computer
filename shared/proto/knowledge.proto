syntax = "proto3";
package ultra.knowledge;
import "common.proto";

message KnowledgeEntry {
  string id = 1;
  string name = 2;
  string description = 3;
  string content = 4;
  string summary = 5;
  string content_type = 6;
  string category = 7;
  string tags = 8;
  int32 size_bytes = 9;
  int32 token_estimate = 10;
  bool enabled = 11;
  int32 priority = 12;
  string tier_policy = 13;
  int64 created_at = 14;
  int64 updated_at = 15;
}

message KnowledgeList {
  repeated KnowledgeEntry entries = 1;
}

message SearchKnowledgeRequest {
  string query = 1;
  int32 limit = 2;
}

message CreateKnowledgeRequest {
  string name = 1;
  string description = 2;
  string content = 3;
  string content_type = 4;
  string category = 5;
  string tags = 6;
  int32 priority = 7;
  string tier_policy = 8;
}

service KnowledgeService {
  rpc ListKnowledge(ultra.common.Empty) returns (KnowledgeList);
  rpc GetKnowledgeEntry(ultra.common.IdRequest) returns (KnowledgeEntry);
  rpc CreateKnowledgeEntry(CreateKnowledgeRequest) returns (KnowledgeEntry);
  rpc DeleteKnowledgeEntry(ultra.common.IdRequest) returns (ultra.common.DeleteResponse);
  rpc SearchKnowledge(SearchKnowledgeRequest) returns (KnowledgeList);
}
