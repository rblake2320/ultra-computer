      operationId: oauthCallback
      summary: OAuth 2.0 callback — exchanges code for token and redirects
      tags: [OAuth]
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
        - name: error_description
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect to /#/connectors with oauth=success or oauth=error

  # ─── Swarm ─────────────────────────────────────────────────────────────────

  /api/swarm/sessions:
    get:
      operationId: listSwarmSessions
      summary: List all swarm sessions
      tags: [Swarm]
      responses:
        '200':
          description: Swarm sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SwarmSession'
    post:
      operationId: createSwarmSession
      summary: Create a new swarm session
      tags: [Swarm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goal]
              properties:
                goal:
                  type: string
                name:
                  type: string
                maxAgents:
                  type: integer
                  default: 10
                enableDynamicSpawning:
                  type: boolean
                  default: true
                agents:
                  type: array
                  items:
                    type: object
      responses:
        '201':
          description: Created swarm session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwarmSession'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/swarm/sessions/{id}:
    get:
      operationId: getSwarmSession
      summary: Get swarm session detail (full serialized state)
      tags: [Swarm]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Full swarm session state
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteSwarmSession
      summary: Delete a swarm session
      tags: [Swarm]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/swarm/sessions/{id}/start:
    post:
      operationId: startSwarmSession
      summary: Start swarm execution
      tags: [Swarm]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  startedAt:
                    type: integer

  /api/swarm/sessions/{id}/stop:
    post:
      operationId: stopSwarmSession
      summary: Gracefully stop a swarm session
      tags: [Swarm]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session status
          content:
            application/json:
              schema:
                type: object

  /api/swarm/sessions/{id}/terminate:
    post:
      operationId: terminateSwarmSession
      summary: Force-terminate a swarm session
      tags: [Swarm]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  default: Terminated by user
      responses:
        '200':
          description: Session status
          content:
            application/json:
              schema:
                type: object

  /api/swarm/sessions/{id}/run:
    post:
      operationId: runSwarmSession
      summary: Full auto-execution loop — run until complete or error
      tags: [Swarm]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
