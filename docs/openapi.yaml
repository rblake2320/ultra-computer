          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /api/observability/traces/{traceId}/summary:
    get:
      operationId: getObservabilityTraceSummary
      summary: Get a summary of a completed trace
      tags: [QualityGates]
      parameters:
        - name: traceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trace summary
          content:
            application/json:
              schema:
                type: object

  /api/observability/search:
    post:
      operationId: searchObservabilityTraces
      summary: Search observability traces
