                  type: string
                attributes:
                  type: object
                conversationId:
                  type: string
      responses:
        '200':
          description: Trace span created
          content:
            application/json:
              schema:
                type: object
                properties:
                  spanId:
                    type: string
                  traceId:
                    type: string
                  startedAt:
                    type: integer

