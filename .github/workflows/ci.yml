name: CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20.x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit -- --run
      - run: npm run test:coverage
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
        if: runner.os == 'Linux'
      - name: Secret scan
        run: gitleaks detect --no-banner --redact --source . --exit-code 1
        if: runner.os == 'Linux'
      - run: npm run build
      - run: npm run audit
      - run: npm run sbom
      - run: npm run smoke:prod
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.os }}-node-${{ matrix.node }}
          path: reports/sbom.cdx.json
          if-no-files-found: error
