    post:
      operationId: spawnSwarmAgent
      summary: Dynamically spawn a child agent from a parent agent
      tags: [Swarm]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: agentId
          in: path
          required: true
