        '200':
          description: Capabilities
          content:
            application/json:
              schema:
                type: object

  /api/voice/transcribe:
    post:
      operationId: transcribeAudio
      summary: Transcribe audio to text (ASR) — JSON with base64 or raw binary body
      tags: [Voice]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  description: Base64-encoded audio data
                format:
                  type: string
                  enum: [wav, opus, flac, mp3, pcm]
                  default: wav
                languageCode:
                  type: string
                enablePunctuation:
                  type: boolean
                  default: true
                enableTimestamps:
                  type: boolean
                maxAlternatives:
                  type: integer
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Transcription result
          content:
            application/json:
              schema:
                type: object
                properties:
                  transcript:
                    type: string
                  alternatives:
                    type: array
                    items:
                      type: object
                  words:
                    type: array
                    items:
                      type: object

  /api/voice/synthesize:
    post:
      operationId: synthesizeSpeech
      summary: Synthesize text to speech (TTS)
      tags: [Voice]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  description: Max 5000 characters
                voice:
                  type: string
                languageCode:
                  type: string
                sampleRate:
                  type: integer
                speed:
                  type: number
                pitch:
                  type: number
                volume:
                  type: number
                format:
                  type: string
                  enum: [wav, pcm, mp3]
                returnBase64:
                  type: boolean
                  description: If true, returns JSON with base64 audio; otherwise returns raw audio bytes
      responses:
        '200':
          description: Audio data (raw bytes or JSON with base64)
          content:
            audio/wav:
              schema:
                type: string
                format: binary
            audio/mpeg:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: object
                properties:
                  audio:
                    type: string
                    description: Base64-encoded audio
                  format:
                    type: string
                  sampleRate:
                    type: integer
                  durationMs:
                    type: integer

  /api/voice/pipeline:
    post:
      operationId: voicePipeline
      summary: Full voice pipeline — audio in → process → audio out
      tags: [Voice]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  description: Base64-encoded input audio
