      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Attributes to merge into the span
      responses:
        '200':
          description: Attributes updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'

  /api/observability/traces/{traceId}:
    get:
      operationId: getObservabilityTrace
