openapi: 3.1.0
info:
  title: Ultra Computer API
  version: 0.9.0
  description: |
    Full REST API for Ultra Computer — an AI orchestration platform with multi-agent
    swarm coordination, autonomous scheduling, voice, browser automation, marketplace,
    identity, messaging, and protocol interoperability (A2A, MCP, CLI, webhooks).

servers:
  - url: http://localhost:5000
    description: Local development server

tags:
  - name: Models
    description: AI model management — connect, configure, and assign roles
  - name: Conversations
    description: Conversation sessions, messages, and SSE streaming
  - name: Tasks
    description: Task records and agent run history
  - name: Skills
    description: Instruction skills and skill scripts
  - name: Connectors
    description: External service connectors and OAuth
  - name: Memory
    description: Persistent memory store with semantic search
  - name: Settings
    description: Application settings
  - name: Sandbox
    description: Docker sandbox management and file system
  - name: Files
    description: Sandbox file operations (read, upload, download, delete)
  - name: Knowledge
    description: Knowledge base entries and context injection
  - name: Health
    description: System health and readiness
  - name: Queue
    description: Task queue status
  - name: Notifications
    description: Global SSE notification stream
  - name: Swarm
    description: Multi-agent swarm coordination sessions
  - name: Autonomy
    description: Self-heal watchdog, checkpointing, cron, circuit breakers, self-learning
  - name: Telemetry
    description: Telemetry settings, aggregates, and GDPR data management
  - name: Cache
    description: Prompt/response cache management
  - name: Browser
    description: Browser automation sessions (navigate, action, screenshot)
  - name: Voice
    description: ASR (speech-to-text), TTS (text-to-speech), and voice pipeline
  - name: Marketplace
    description: Community skill marketplace — publish, install, fork, rate
  - name: Messaging
    description: Omni-channel messaging (Slack, Gmail, webhooks, WebSocket)
  - name: NIP
    description: NLP Instruction Protocol — AI-to-AI instruction sessions
  - name: Identity
    description: Tamper-proof cryptographic identity system
  - name: Protocols
    description: A2A, MCP, CLI, HTTP/webhooks, and code interpreter protocols
  - name: QualityGates
    description: Crucible validation, Sentinel safety, Debugger diagnosis, Observability, Structured Output, Cost Controller
  - name: Export
    description: Session export to Markdown
  - name: OAuth
    description: OAuth 2.0 authorization flow
  - name: Setup
    description: First-run setup wizard

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer JWT token
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key authentication

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]

    Model:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          type: string
        modelId:
          type: string
        baseUrl:
          type: string
          nullable: true
        apiKey:
          type: string
          nullable: true
        status:
          type: string
          enum: [connected, disconnected, error]
        isDefault:
          type: boolean
        isOrchestrator:
          type: boolean
        roles:
          type: array
          items:
            type: string
        config:
          type: object
          nullable: true

    Conversation:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
        orchestratorModelId:
          type: string
          nullable: true
        createdAt:
          type: integer
        updatedAt:
          type: integer

    Message:
      type: object
      properties:
        id:
          type: string
        conversationId:
          type: string
        role:
          type: string
          enum: [user, assistant, system, tool]
        content:
          type: string
          nullable: true
        modelId:
          type: string
          nullable: true
        taskId:
          type: string
          nullable: true
        createdAt:
          type: integer

    Task:
      type: object
      properties:
        id:
          type: string
        conversationId:
          type: string
        parentTaskId:
          type: string
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        taskType:
          type: string
        status:
          type: string
          enum: [pending, running, complete, completed, failed, cancelled]
        startedAt:
          type: integer
          nullable: true
        completedAt:
          type: integer
          nullable: true

    AgentRun:
      type: object
      properties:
        id:
          type: string
        taskId:
          type: string
        modelId:
          type: string
        status:
          type: string
        level:
          type: integer
        output:
          type: string
          nullable: true
        tokenUsage:
          type: string
          nullable: true
        startedAt:
          type: integer
          nullable: true
        completedAt:
          type: integer
          nullable: true

    Skill:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        content:
          type: string
        triggerKeywords:
          type: string
          nullable: true
        isBuiltIn:
          type: boolean
        enabled:
          type: boolean

    SkillScript:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        language:
          type: string
        content:
          type: string
        tags:
          type: string
          nullable: true
        version:
          type: integer
        isFavorite:
          type: boolean

    Connector:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        status:
          type: string
          enum: [connected, disconnected, error]
        config:
          type: string
          nullable: true
        scopes:
          type: string
          nullable: true
        lastSynced:
          type: integer
          nullable: true

    Memory:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        type:
          type: string
        tags:
          type: string
          nullable: true
        embedding:
          type: string
          nullable: true
        createdAt:
          type: integer

    KnowledgeEntry:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        category:
          type: string
        contentType:
          type: string
        tier:
          type: string
          enum: [fast, medium, powerful]
        tags:
          type: string
          nullable: true
        priority:
          type: integer
        enabled:
          type: boolean

    SwarmSession:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        goal:
          type: string
        status:
          type: string
          enum: [idle, running, stopping, completed, terminated, error]
        agentCount:
          type: integer
        taskCount:
          type: integer
        blackboardEntries:
          type: integer
        consensusRounds:
          type: integer
        startedAt:
          type: integer
          nullable: true
        completedAt:
          type: integer
          nullable: true
        totalTokensUsed:
          type: integer
        totalAgentsSpawned:
          type: integer
        circuitBroken:
          type: boolean
        error:
          type: string
          nullable: true

    SwarmAgent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
        status:
          type: string
        instructions:
          type: string
        modelId:
          type: string
          nullable: true
        tools:
          type: array
          items:
            type: string
        canSpawn:
          type: boolean
        spawnDepth:
          type: integer

    SwarmTask:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, claimed, running, complete, failed]
        priority:
          type: integer
        assignedAgentId:
          type: string
          nullable: true
        result:
          type: string
          nullable: true

    MarketplaceSkill:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        longDescription:
          type: string
        authorName:
          type: string
        authorEmail:
          type: string
          nullable: true
        category:
          type: string
        tags:
          type: string
        license:
          type: string
        repoUrl:
          type: string
          nullable: true
        currentVersion:
          type: string
        visibility:
          type: string
          enum: [public, private, unlisted]
        featured:
          type: boolean
        verified:
          type: boolean
        installCount:
          type: integer
        ratingSum:
          type: integer
        ratingCount:
          type: integer

    MessagingChannel:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [slack, gmail, webhook, websocket]
        name:
          type: string
        status:
          type: string
          enum: [connected, disconnected, error]
        config:
          type: object
        createdAt:
          type: string

    NIPSession:
      type: object
      properties:
        id:
          type: string
        state:
          type: string
          enum: [created, negotiating, active, paused, completed, terminated]
        instructorProfile:
          type: object
        executorProfile:
          type: object
        taskScope:
          type: object
          nullable: true
        accessTier:
          type: string
          enum: [public, verified, corporate, private]
        createdAt:
          type: integer

    Identity:
      type: object
      properties:
        cryptoId:
          type: string
          description: 64-character hex public key fingerprint
        displayName:
          type: string
        bio:
          type: string
          nullable: true
        organizationName:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        tier:
          type: string
        status:
          type: string
          enum: [active, suspended, banned]
        trustScore:
          type: number

    CheckpointEntry:
      type: object
      properties:
        id:
          type: string
        taskId:
          type: string
        conversationId:
          type: string
        taskTitle:
          type: string
        status:
          type: string
          enum: [running, completed, failed, abandoned]
        totalSteps:
          type: integer
        completedSteps:
          type: integer

    CronJob:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        schedule:
          type: string
        enabled:
          type: boolean
        lastRun:
          type: integer
          nullable: true
        nextRun:
          type: integer
          nullable: true

paths:
  # ─── Health ────────────────────────────────────────────────────────────────

  /api/health:
    get:
      operationId: getHealth
      summary: System health check
      tags: [Health]
      responses:
        '200':
          description: System health summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  modelCount:
                    type: integer
                  hasOrchestratorModel:
                    type: boolean
                  hasDefaultModel:
                    type: boolean
                  memoryCount:
                    type: integer
                  skillCount:
                    type: integer
                  connectorCount:
                    type: integer
                  sandbox:
                    type: object
                  taskQueue:
                    type: boolean
                  marketplaceSkillCount:
                    type: integer
                  knowledgeBaseEntries:
                    type: integer

  # ─── Models ────────────────────────────────────────────────────────────────

  /api/models:
    get:
      operationId: listModels
      summary: List all AI models
      tags: [Models]
      responses:
        '200':
          description: Array of models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Model'
    post:
      operationId: createModel
      summary: Add a new AI model
      tags: [Models]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, provider, modelId]
              properties:
                name:
                  type: string
                provider:
                  type: string
                modelId:
                  type: string
                baseUrl:
                  type: string
                apiKey:
                  type: string
                config:
                  type: object
      responses:
        '200':
          description: Created model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/models/providers:
    get:
      operationId: listModelProviders
      summary: List all supported model providers and their registry
      tags: [Models]
      responses:
        '200':
          description: Provider registry
          content:
            application/json:
              schema:
                type: object

  /api/models/env-vars:
    get:
      operationId: discoverModelEnvVars
      summary: Discover configured model environment variables
      tags: [Models]
      responses:
        '200':
          description: Discovered environment variables
          content:
            application/json:
              schema:
                type: object

  /api/models/roles:
    get:
      operationId: getModelRoles
      summary: Get current model role assignments (orchestrator, default, etc.)
      tags: [Models]
      responses:
        '200':
          description: Model role assignments
          content:
            application/json:
              schema:
                type: object

  /api/models/discover-local:
    post:
      operationId: discoverLocalModels
      summary: Discover locally running models (Ollama, LM Studio, etc.)
      tags: [Models]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                baseUrl:
                  type: string
      responses:
        '200':
          description: Discovered models
          content:
            application/json:
              schema:
                type: object

  /api/models/quick-add:
    post:
      operationId: quickAddModel
      summary: Quickly add a model from provider catalog
      tags: [Models]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, modelId]
              properties:
                provider:
                  type: string
                modelId:
                  type: string
                apiKey:
                  type: string
      responses:
        '200':
          description: Added model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'

  /api/models/roles/{role}:
    put:
      operationId: assignModelRole
      summary: Assign a model to a specific role
      tags: [Models]
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelId]
              properties:
                modelId:
                  type: string
      responses:
        '200':
          description: Updated role assignment
          content:
            application/json:
              schema:
                type: object

  /api/models/{id}:
    get:
      operationId: getModel
      summary: Get a model by ID
      tags: [Models]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateModel
      summary: Update model configuration
      tags: [Models]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                baseUrl:
                  type: string
                apiKey:
                  type: string
                config:
                  type: object
      responses:
        '200':
          description: Updated model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
    delete:
      operationId: deleteModel
      summary: Delete a model
      tags: [Models]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'

  /api/models/{id}/connect:
    post:
      operationId: connectModel
      summary: Connect to a model (test and mark as connected)
      tags: [Models]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Connection result
          content:
            application/json:
              schema:
                type: object

  /api/models/{id}/disconnect:
    post:
      operationId: disconnectModel
      summary: Disconnect a model
      tags: [Models]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Disconnected
          content:
            application/json:
              schema:
                type: object

  /api/models/{id}/test:
    post:
      operationId: testModel
      summary: Test a model connection
      tags: [Models]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Test result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  latencyMs:
                    type: number
                  error:
                    type: string

  /api/models/{id}/assign-role:
    post:
      operationId: assignModelToRole
      summary: Assign a model to a role
      tags: [Models]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
      responses:
        '200':
          description: Role assigned
          content:
            application/json:
              schema:
                type: object

  /api/models/{id}/unassign-role:
    post:
      operationId: unassignModelRole
      summary: Unassign a model from a role
      tags: [Models]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
      responses:
        '200':
          description: Role unassigned
          content:
            application/json:
              schema:
                type: object

  # ─── Conversations ─────────────────────────────────────────────────────────

  /api/conversations:
    get:
      operationId: listConversations
      summary: List all conversations
      tags: [Conversations]
      responses:
        '200':
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
    post:
      operationId: createConversation
      summary: Create a new conversation
      tags: [Conversations]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                orchestratorModelId:
                  type: string
      responses:
        '200':
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'

  /api/conversations/{id}:
    get:
      operationId: getConversation
      summary: Get a conversation by ID
      tags: [Conversations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateConversation
      summary: Update a conversation (title, status, orchestratorModelId)
      tags: [Conversations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                status:
                  type: string
                orchestratorModelId:
                  type: string
      responses:
        '200':
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
    delete:
      operationId: deleteConversation
      summary: Delete a conversation and all its messages/tasks
      tags: [Conversations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'

  /api/conversations/{id}/messages:
    get:
      operationId: getMessages
      summary: Get all messages for a conversation
      tags: [Conversations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
    post:
      operationId: sendMessage
      summary: Send a message and trigger orchestration
      tags: [Conversations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                role:
                  type: string
                  default: user
                modelId:
                  type: string
      responses:
        '200':
          description: Created message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /api/conversations/{id}/stream:
    get:
      operationId: streamConversation
      summary: SSE stream for real-time conversation events
      tags: [Conversations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: string

  /api/conversations/{id}/tasks:
    get:
      operationId: getConversationTasks
      summary: Get all tasks for a conversation
      tags: [Tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'

  /api/conversations/{id}/agent-runs:
    get:
      operationId: getConversationAgentRuns
      summary: Get agent runs for a conversation
      tags: [Tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentRun'

  /api/conversations/{id}/export:
    get:
      operationId: exportConversation
      summary: Export a conversation as a Markdown document
      tags: [Export]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Markdown document
          content:
            text/markdown:
              schema:
                type: string
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Export too large (exceeds 50 MB)

  /api/all-agent-runs:
    get:
      operationId: getAllAgentRuns
      summary: Get all agent runs across all conversations
      tags: [Tasks]
      responses:
        '200':
          description: All agent runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentRun'

