          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                attributes:
                  type: object
      responses:
        '200':
          description: Event added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'

  /api/observability/traces/{spanId}/attributes:
