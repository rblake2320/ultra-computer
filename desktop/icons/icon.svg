<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" aria-label="Ultra Computer icon">
  <!-- Hexagon background -->
  <polygon
    points="128,12 224,64 224,192 128,244 32,192 32,64"
    fill="#0f172a"
    stroke="#14b8a6"
    stroke-width="8"
    stroke-linejoin="round"
  />

  <!-- Inner hexagon accent ring -->
  <polygon
    points="128,30 210,76 210,180 128,226 46,180 46,76"
    fill="none"
    stroke="#14b8a6"
    stroke-width="2"
    stroke-linejoin="round"
