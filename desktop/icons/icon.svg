  />

  <!-- Letterform "U" -->
  <path
    d="M82 88
       L82 154
       Q82 176 105 176
       L128 176
       Q151 176 151 154
       L151 88"
    stroke="#14b8a6"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Letterform "C" -->
  <path
    d="M186 110
       Q186 88 164 88
       L155 88
       Q133 88 133 110
       L133 148
       Q133 168 155 168
       L164 168
       Q186 168 186 148"
