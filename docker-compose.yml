# Ultra Computer — production-shaped local stack
#
# The HTTP app, queue, Temporal server, and Temporal worker are distinct
# processes. Infrastructure services are internal or bound to loopback only.
# No service has a known credential fallback.
#
# Image tags remain version-pinned rather than digest-pinned. Verified
# multi-architecture digests are tracked in PARKED.md and must not be invented.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --loglevel warning
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  temporal-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:?Set TEMPORAL_DB_PASSWORD in .env}
      POSTGRES_DB: temporal
    networks:
      - backend
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.29.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-7233}:7233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?Set TEMPORAL_DB_PASSWORD in .env}
      POSTGRES_SEEDS: temporal-postgres
      BIND_ON_IP: 0.0.0.0
      SKIP_DEFAULT_NAMESPACE_CREATION: "false"
    networks:
      frontend:
        aliases:
          - temporal-frontend
      backend:
        aliases:
          - temporal-backend
    depends_on:
      temporal-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "tctl --address $(hostname -i | awk '{print $1}'):7233 cluster health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

  temporal-ui:
    image: temporalio/ui:2.51.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8080}:8080"
    environment:
      TEMPORAL_ADDRESS: temporal-frontend:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:${TEMPORAL_UI_PORT:-8080}
    networks:
      - frontend
      - backend
    depends_on:
      temporal:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile.live
      target: app
    restart: unless-stopped
    init: true
    read_only: true
    ports:
      - "127.0.0.1:${APP_PORT:-5000}:5000"
      - "127.0.0.1:${GRPC_HOST_PORT:-50051}:50051"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5000
      GRPC_PORT: 50051
      DATABASE_PATH: /app/data/ultra_computer.db
      TRUST_PROXY: ${TRUST_PROXY:-1}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5000}
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TEMPORAL_ADDRESS: temporal-frontend:7233
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-ultra-computer}
      ULTRA_API_KEY: ${ULTRA_API_KEY:?Set ULTRA_API_KEY in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      GMAIL_PUSH_TOKEN: ${GMAIL_PUSH_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      ALLOW_HOST_SHELL: "false"
    networks:
      - frontend
      - backend
    volumes:
      - app-data:/app/data
      - app-ipc:/app/ipc
      - sandbox-data:/app/sandbox
    tmpfs:
      - /tmp:size=128m,mode=1777
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  temporal-worker:
    build:
      context: .
      dockerfile: Dockerfile.live
      target: temporal-worker
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      NODE_ENV: production
      RUN_TEMPORAL_WORKER: "1"
      TEMPORAL_ADDRESS: temporal-frontend:7233
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-ultra-computer}
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_PATH: /app/data/ultra_computer.db
      ULTRA_API_KEY: ${ULTRA_API_KEY:?Set ULTRA_API_KEY in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      ALLOW_HOST_SHELL: "false"
    networks:
      - frontend
      - backend
    volumes:
      - app-data:/app/data
      - app-ipc:/app/ipc
      - sandbox-data:/app/sandbox
    tmpfs:
      - /tmp:size=128m,mode=1777
    depends_on:
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "if(!require('fs').existsSync('/tmp/temporal-worker-ready'))process.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:2026.6.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    networks:
      - frontend
    depends_on:
      app:
        condition: service_healthy
    profiles:
      - tunnel

networks:
  frontend:
  backend:
    internal: true

volumes:
  app-data:
  app-ipc:
  sandbox-data:
  temporal-postgres-data:
