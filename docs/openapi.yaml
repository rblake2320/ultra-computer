    post:
      operationId: extractJsonFromOutput
      summary: Extract and parse JSON from a free-form AI response
      tags: [QualityGates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
